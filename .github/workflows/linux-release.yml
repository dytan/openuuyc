# Build portable-ish Linux x86_64 controller artifacts.
# - workflow_dispatch: upload Actions artifacts only (no GitHub Release)
# - push tag v*: create a GitHub Release with tarball + AppImage + .deb + checksums
#
# Runtime still needs distro libs (libva + GPU drivers, fuse3, Vulkan/Mesa,
# ALSA). See packaging/linux/INSTALL.txt / PACKAGING.md.
# Arch .pkg.tar.zst is built on Arch via packaging/arch/PKGBUILD (not here).
name: Linux release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux-x86_64 (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libssl-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxss-dev \
            libwayland-dev wayland-protocols \
            libgl1-mesa-dev libvulkan-dev \
            libva-dev \
            libfuse3-dev \
            libasound2-dev \
            libdbus-1-dev \
            dpkg-dev fakeroot \
            file desktop-file-utils \
            curl ca-certificates

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release

      - name: Build release binary
        run: cargo build --release --locked

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(./packaging/linux/version.sh)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Package tarball
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NAME="OpenUUYC-linux-x86_64-${VERSION}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          install -m 755 target/release/OpenUUYC "${STAGE}/OpenUUYC"
          install -m 644 packaging/linux/INSTALL.txt "${STAGE}/INSTALL.txt"
          install -m 755 packaging/linux/install.sh "${STAGE}/install.sh"
          install -m 644 packaging/linux/openuuyc.desktop "${STAGE}/openuuyc.desktop"
          mkdir -p "${STAGE}/icons"
          cp -a packaging/linux/icons/. "${STAGE}/icons/"
          {
            echo "# OpenUUYC Linux controller ${VERSION}"
            echo
            echo "Binary built from https://github.com/${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "See INSTALL.txt for runtime dependencies and how to run."
            echo "Desktop/app-launcher install: sudo ./install.sh"
            echo "  (or: PREFIX=\$HOME/.local ./install.sh)"
            echo "Also available from this release: AppImage and .deb — see PACKAGING.md."
            echo "Full docs: README.md / LINUX.md / LINUX-BUILD.md in the repo."
          } > "${STAGE}/README.txt"
          mkdir -p dist
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}.tar.gz" "dist/${NAME}.tar.gz.sha256"
          cat "dist/${NAME}.tar.gz.sha256"

      - name: Build .deb
        id: deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OPENUUYC_BIN: ${{ github.workspace }}/target/release/OpenUUYC
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          ./packaging/linux/build-deb.sh
          DEB="dist/openuuyc_${VERSION}_amd64.deb"
          echo "deb=${DEB}" >> "$GITHUB_OUTPUT"
          echo "deb_checksum=${DEB}.sha256" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        id: appimage
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OPENUUYC_BIN: ${{ github.workspace }}/target/release/OpenUUYC
          OUT_DIR: ${{ github.workspace }}/dist
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          ./packaging/linux/build-appimage.sh
          APP="dist/OpenUUYC-x86_64-${VERSION}.AppImage"
          echo "appimage=${APP}" >> "$GITHUB_OUTPUT"
          echo "appimage_checksum=${APP}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
            ${{ steps.deb.outputs.deb }}
            ${{ steps.deb.outputs.deb_checksum }}
            ${{ steps.appimage.outputs.appimage }}
            ${{ steps.appimage.outputs.appimage_checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TARBALL: ${{ steps.pkg.outputs.tarball }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
          NAME: ${{ steps.pkg.outputs.name }}
          DEB: ${{ steps.deb.outputs.deb }}
          DEB_CHECKSUM: ${{ steps.deb.outputs.deb_checksum }}
          APPIMAGE: ${{ steps.appimage.outputs.appimage }}
          APPIMAGE_CHECKSUM: ${{ steps.appimage.outputs.appimage_checksum }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## OpenUUYC Linux controller ${VERSION}"
            echo
            echo "Prebuilt **x86_64 glibc** controller (built on Ubuntu 22.04)."
            echo
            echo "### Artifacts"
            echo "- \`${NAME}.tar.gz\` — binary + \`install.sh\` + desktop/icons"
            echo "- \`OpenUUYC-x86_64-${VERSION}.AppImage\` — portable single file"
            echo "- \`openuuyc_${VERSION}_amd64.deb\` — Debian/Ubuntu package"
            echo "- \`*.sha256\` — SHA-256 checksums"
            echo
            echo "Arch Linux / Omarchy: use \`packaging/arch/PKGBUILD\` with \`makepkg\`"
            echo "and \`pacman -U\` (not built on this Ubuntu runner)."
            echo
            echo "### Install"
            echo '```bash'
            echo "# AppImage"
            echo "chmod +x OpenUUYC-x86_64-${VERSION}.AppImage"
            echo "./OpenUUYC-x86_64-${VERSION}.AppImage"
            echo
            echo "# Debian/Ubuntu"
            echo "sudo apt install ./openuuyc_${VERSION}_amd64.deb"
            echo
            echo "# Tarball"
            echo "tar -xzf ${NAME}.tar.gz && cd ${NAME}"
            echo "sudo ./install.sh   # or: PREFIX=\$HOME/.local ./install.sh"
            echo '```'
            echo
            echo "You do **not** need Rust on each machine if you use these artifacts on a"
            echo "compatible x86_64 glibc distro. You **do** still need runtime libraries:"
            echo "**libva** (+ GPU VA-API drivers), **fuse3**, Vulkan/Mesa (or GLES), ALSA,"
            echo "and a desktop session with Secret Service."
            echo
            echo "VA-API hardware decode uses the **machine's** libva drivers at runtime;"
            echo "CI cannot ship GPU drivers."
            echo
            echo "Packaging details: \`packaging/linux/PACKAGING.md\`."
            echo
            echo "To publish: tag matching Cargo.toml, e.g. \`git tag v${VERSION} && git push <remote> v${VERSION}\`."
            echo
            echo "Source / build-from-source: see \`LINUX-BUILD.md\`."
          } > "${NOTES}"
          gh release create "${GITHUB_REF_NAME}" \
            "${TARBALL}" "${CHECKSUM}" \
            "${APPIMAGE}" "${APPIMAGE_CHECKSUM}" \
            "${DEB}" "${DEB_CHECKSUM}" \
            --title "OpenUUYC ${VERSION} (Linux x86_64)" \
            --notes-file "${NOTES}"
